<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Surface startup paint fixture</title>
  <link rel="stylesheet" href="fixture.css">
  <style>
    #startup-shell{min-height:100vh;background:#fff}
    #startup-left-rail,#startup-right-rail{position:fixed;top:120px;width:180px;min-height:180px;padding:12px;background:#fff;color:#202122}
    #startup-left-rail{left:0}
    #startup-right-rail{right:0}
    #startup-left-rail a,#startup-right-rail label{display:block;margin:8px 0}
  </style>
</head><body>
  <div id="startup-shell"><main><article><h1>Theme before first view</h1><p>This document pauses parsing long enough to exercise visible startup frames.</p><p>The selected theme must be resident while the parser builds the page.</p><p>The first visible frame should already use the selected theme.</p></article></main></div>
  <div id="startup-left-rail"></div>
  <div id="startup-right-rail"></div>
  <script>
    document.querySelector('#startup-left-rail').innerHTML = '<nav><a href="#one">One</a><a href="#two">Two</a><a href="#three">Three</a><a href="#four">Four</a></nav>';
    document.querySelector('#startup-right-rail').innerHTML = '<form><label><input type="radio" name="setting" checked> One</label><label><input type="radio" name="setting"> Two</label><label><input type="radio" name="setting"> Three</label></form>';
  </script>
  <script src="/slow-script.js"></script>
</body></html>
